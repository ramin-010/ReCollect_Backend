        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Task Reminder</title>
          </head>
          <body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #ffffff;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #ffffff;">
              <tr>
                <td align="center" style="padding: 48px 24px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 520px;">
                    
                    <!-- Logo -->
                    <tr>
                      <td style="padding-bottom: 40px; border-bottom: 1px solid #e5e5e5;">
                        <img src="https://res.cloudinary.com/dsfb3jjqx/image/upload/v1765101198/recollect/pyf5tmicuidnxtmi76e5.png" alt="ReCollect" height="80" style="display: block;" />
                      </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                      <td style="padding: 40px 0;">
                        <p style="margin: 0 0 8px; font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;">
                          Task Reminder
                        </p>
                        <h1 style="margin: 0 0 24px; font-size: 24px; font-weight: 600; color: #111827; line-height: 1.3;">
                          ${todo.text}
                        </h1>
                        <p style="margin: 0; font-size: 15px; color: #4b5563; line-height: 1.6;">
                          Hi ${user.name}, this is a reminder for your scheduled task.
                        </p>
                      </td>
                    </tr>

                    <!-- CTA -->
                    <tr>
                      <td style="padding-bottom: 40px;">
                        <a href="${process.env.FRONTEND_URL}/dashboard?view=todos" 
                           style="display: inline-block; background-color: #111827; color: #ffffff; text-decoration: none; padding: 12px 24px; font-size: 14px; font-weight: 500; border-radius: 6px;">
                          View Task
                        </a>
                      </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                      <td style="padding-top: 32px; border-top: 1px solid #e5e5e5;">
                        <p style="margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.6;">
                          ReCollect · <a href="${process.env.FRONTEND_URL}/dashboard" style="color: #9ca3af;">Manage notifications</a>
                        </p>
                      </td>
                    </tr>

                  </table>
                </td>
              </tr>
            </table>
          </body>
        </html>
